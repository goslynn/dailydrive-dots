# GTK4 — ajustes de apariencia.
#
# GTK4 NO usa temas de GTK3: catppuccin-gtk no le aplica, y `gtk-theme-name`
# aquí sería ruido. Lo que sí respeta son iconos, cursor y fuente, y el modo
# claro/oscuro lo decide libadwaita a partir de `color-scheme` del portal
# Settings — declarado en nix/home/theming.nix, no aquí.
#
# Hoy no hay ninguna app GTK4 instalada; esto está para que la primera que
# entre no aparezca con Adwaita y fuente por defecto.

[Settings]
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=catppuccin-frappe-dark-cursors
gtk-cursor-theme-size=24
gtk-font-name=Google Sans 11
gtk-application-prefer-dark-theme=1
