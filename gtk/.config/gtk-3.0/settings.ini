# GTK3 — ajustes de apariencia.
#
# En la sesión, GTK_THEME (conf.d/env.lua) ya gana sobre `gtk-theme-name`: se
# repite aquí porque este fichero es lo que leen las herramientas que NO ven
# las variables de la sesión (nwg-look, apps lanzadas desde una unidad de
# systemd, etc.), y porque el resto de claves —iconos, cursor, fuente,
# hinting— no tienen equivalente en variable de entorno.
#
# El otro consumidor de estos mismos valores es el portal Settings
# (xdg-desktop-portal-gtk), pero ése lee gsettings/dconf, no este INI: eso se
# declara en nix/home/theming.nix. Ambos tienen que decir lo mismo.
#
# Los nombres de tema/iconos/cursor tienen que coincidir con los paquetes de
# nix/system/desktop.nix.

[Settings]
gtk-theme-name=catppuccin-frappe-lavender-standard
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=catppuccin-frappe-dark-cursors
gtk-cursor-theme-size=24
gtk-font-name=Google Sans 11

# Para los widgets que consultan la preferencia de esquema en vez del tema
# (libadwaita y GTK4 la sacan del portal Settings, no de aquí).
gtk-application-prefer-dark-theme=1

gtk-enable-animations=true
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
