# xdg-desktop-portal-hyprland — screencast/screenshare backend.
#
# Read from ~/.config/hypr/xdph.conf at xdph startup only (no live reload);
# after editing run `systemctl --user restart xdg-desktop-portal-hyprland`.
# Syntax is hyprlang, same as hyprland.conf — the keys map to the
# `screencopy:<key>` names embedded in the xdph binary.

screencopy {
    # Pre-ticks "Allow a restore token" in hyprland-share-picker.
    #
    # Why this exists: Chromium (so Brave) opens MORE THAN ONE ScreenCast
    # portal session for a single getDisplayMedia() call — one to render the
    # preview inside its own "Choose what to share" dialog, another for the
    # real stream. Each session pops hyprland-share-picker again, which is the
    # duplicated system dialog. hyprwm closed this as won't-fix on the xdph
    # side (issue #11): the extra sessions come from the app, not the portal.
    #
    # A restore token is the only lever available here — it lets a later
    # session reuse the earlier selection instead of prompting again. Ticking
    # it by default means we don't have to catch the checkbox on the first
    # popup. Note it is a mitigation, not a cure: Chromium's restore-token
    # handling is known to be flaky (xdph issues #123 and #350), so the second
    # picker may still appear. Brave's own picker never goes away either — that
    # one is required by the getDisplayMedia spec.
    allow_token_by_default = true
}
